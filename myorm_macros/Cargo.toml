[package]
name = "myorm_macros"
version = "0.1.0"
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = { version = "3.2.0", default-features = false }
proc-macro2 = { version = "1.0.93", default-features = false }
quote = { version = "1.0.38", default-features = false }
syn = { version = "2.0.96", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }
