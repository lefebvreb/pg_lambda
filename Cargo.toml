[workspace]
members = [".", "pg_lambda_macros"]
resolver = "2"

[workspace.package]
edition = "2021"

[package]
name = "pg_lambda"
version = "0.1.0"
edition.workspace = true

[dependencies]
constcat = "0.6.0"
inventory = { version = "0.3.19", default-features = false }
lazy_static = { version = "1.5.0", default-features = false }
serde = { version = "1.0.217", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.138", default-features = false, features = ["alloc"] }
tokio-postgres = { version = "0.7.13", default-features = false }

[dependencies.pg_lambda_macros]
path = "pg_lambda_macros"
